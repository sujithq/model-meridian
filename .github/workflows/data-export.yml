name: Export Artificial Analysis data

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Export chart data to CSV
        shell: bash
        run: |
          python scripts/export_artificial_analysis_csv.py --output-dir data
          LATEST_CSV=$(ls -1t data/artificial-analysis-intelligence-index-vs-cost-all-plotted-models-*.csv | head -n 1)
          mv "$LATEST_CSV" data/data.csv

      - name: Commit refreshed CSV
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.csv
          git diff --cached --quiet || git commit -m "chore(data): refresh Artificial Analysis export"
          git push
