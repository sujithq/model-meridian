name: Refresh source data

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      compare_viewports:
        description: Compare point IDs at desktop, large, ultrawide and mobile sizes without updating the CSV
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: source-data-refresh
  cancel-in-progress: false

jobs:
  export-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Validate diagnostic branch
        if: github.ref != 'refs/heads/main'
        env:
          REQUIRE_BROWSER_TESTS: "1"
        run: python -m unittest discover -s tests -v

      - name: Compare chart viewports
        if: inputs.compare_viewports
        run: |
          python - <<'PY'
          import csv
          import json
          import sys
          from pathlib import Path
          from unittest.mock import patch

          sys.path.insert(0, "scripts")
          import export_source
          from export_pipeline import ExportOptions, run_export

          directory = Path("out/export-diagnostics")
          directory.mkdir(parents=True, exist_ok=True)
          with Path("data/data.csv").open(encoding="utf-8-sig", newline="") as handle:
              baseline_ids = {row["id"] for row in csv.DictReader(handle)}
          comparisons = []
          for name, width, height in (
              ("desktop", 1600, 1200),
              ("large", 2560, 1440),
              ("ultrawide", 3840, 2160),
              ("mobile", 390, 844),
          ):
              viewport = {"width": width, "height": height}
              output = directory / name
              with patch.object(export_source, "VIEWPORT", viewport):
                  with export_source.PlaywrightChartSource(
                      timeout=60000, diagnostics_dir=output
                  ) as source:
                      result = run_export(source, ExportOptions(output_dir=output))
              ids = {point.id for point in result.points}
              comparison = {
                  "name": name,
                  "viewport": viewport,
                  "selected_count": result.selected_count,
                  "plotted_count": result.plotted_count,
                  "exported_count": len(ids),
                  "retained_count": len(ids & baseline_ids),
                  "missing_ids": sorted(baseline_ids - ids),
                  "added_ids": sorted(ids - baseline_ids),
                  "ids": sorted(ids),
              }
              comparisons.append(comparison)
              (directory / "viewport-comparison.json").write_text(
                  json.dumps(comparisons, indent=2), encoding="utf-8"
              )
              print(
                  f"{name} {width}x{height}: selected={result.selected_count}, "
                  f"points={len(ids)}, retained={len(ids & baseline_ids)}, "
                  f"missing={len(baseline_ids - ids)}",
                  flush=True,
              )
          PY

      - name: Export source chart data to CSV
        if: ${{ !inputs.compare_viewports }}
        shell: bash
        run: |
          for attempt in 1 2; do
            status=0
            python scripts/export_artificial_analysis_csv.py \
              --output data/data.csv \
              --diagnostics-dir out/export-diagnostics || status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$status" -ne 75 ] || [ "$attempt" -eq 2 ]; then
              exit "$status"
            fi
            echo "::warning::Transient browser/network failure; retrying once in 30 seconds."
            sleep 30
          done

      - name: Upload export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-diagnostics
          path: out/export-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Commit refreshed CSV
        if: github.ref == 'refs/heads/main' && !inputs.compare_viewports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.csv
          if git diff --cached --quiet; then
            echo "No meaningful data changes; nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): refresh source export"
          git push
