name: Refresh source data

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-data-refresh
  cancel-in-progress: false

jobs:
  export-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Validate diagnostic branch
        if: github.ref != 'refs/heads/main'
        env:
          REQUIRE_BROWSER_TESTS: "1"
        run: python -m unittest discover -s tests -v

      - name: Export source chart data to CSV
        shell: bash
        run: |
          for attempt in 1 2; do
            status=0
            python scripts/export_artificial_analysis_csv.py \
              --output data/data.csv \
              --diagnostics-dir out/export-diagnostics || status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$status" -ne 75 ] || [ "$attempt" -eq 2 ]; then
              exit "$status"
            fi
            echo "::warning::Transient browser/network failure; retrying once in 30 seconds."
            sleep 30
          done

      - name: Upload export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-diagnostics
          path: out/export-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Commit refreshed CSV
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.csv
          if git diff --cached --quiet; then
            echo "No meaningful data changes; nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): refresh source export"
          git push
