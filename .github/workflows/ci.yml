name: CI

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "data/*.csv"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "data/*.csv"
      - ".gitignore"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m py_compile generate_chart.py
