name: CI

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "data/*.csv"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "data/*.csv"
      - ".gitignore"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m py_compile scripts/chart_data.py scripts/generate_chart.py scripts/generate_page.py scripts/export_artificial_analysis_csv.py
      - name: Run characterization tests
        run: python -m unittest discover -s tests -v
      - name: Render example outputs
        run: |
          python scripts/generate_chart.py data/data.csv -o out/chart.png
          python scripts/generate_page.py data/data.csv -o out/index.html
